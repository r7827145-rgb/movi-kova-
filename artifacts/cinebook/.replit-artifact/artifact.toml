kind = "web"
previewPath = "/"
title = "CineBook"
version = "1.0.0"
id = "artifacts/cinebook"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23209

[services.development]
run = "pnpm --filter @workspace/cinebook run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinebook", "run", "build" ]
publicDir = "artifacts/cinebook/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23209"
BASE_PATH = "/"
